<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TrucoPro — Mesa</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700;800&family=Crimson+Pro:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600;1,700&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; min-height: 100vh; font-family: 'Inter', system-ui, sans-serif; }
  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  #root { width: 100%; min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="common.jsx"></script>
<script type="text/babel" src="variant-c.jsx"></script>
<script type="text/babel" src="variant-c2.jsx"></script>

<script type="text/babel">
const TWEAKS = /*EDITMODE-BEGIN*/{
  "counterScore1": 11,
  "counterScore2": 27,
  "counterMax": 40
}/*EDITMODE-END*/;

function App() {
  const { TweaksPanel, useTweaks, TweakSection, TweakSlider, TweakNumber } = window;
  const [t, setTweak] = useTweaks(TWEAKS);

  const { LoginC, SetupC, CounterC } = window.C1;
  const { SidebarC, ProfileC, StatsC, HistoryC } = window.C2;
  const { PhoneFrame } = window;

  const Wrap = ({ children }) => <PhoneFrame>{children}</PhoneFrame>;

  return (
    <>
      <DesignCanvas>
        <DCSection id="gameplay" title="En la mesa" subtitle="El contador en vivo, el corazón de la app">
          <DCArtboard id="counter" label="Contador de partido" width={410} height={864}>
            <Wrap><CounterC score1={t.counterScore1} score2={t.counterScore2} max={t.counterMax} /></Wrap>
          </DCArtboard>
          <DCArtboard id="setup" label="Armar mesa" width={410} height={864}>
            <Wrap><SetupC /></Wrap>
          </DCArtboard>
          <DCArtboard id="sidebar" label="Navegación" width={410} height={864}>
            <Wrap><SidebarC /></Wrap>
          </DCArtboard>
        </DCSection>

        <DCSection id="player" title="El jugador" subtitle="Perfil propio, ranking, y partidas pasadas">
          <DCArtboard id="profile" label="Mi perfil" width={410} height={864}>
            <Wrap><ProfileC /></Wrap>
          </DCArtboard>
          <DCArtboard id="stats" label="Ranking" width={410} height={864}>
            <Wrap><StatsC /></Wrap>
          </DCArtboard>
          <DCArtboard id="history" label="Historial" width={410} height={864}>
            <Wrap><HistoryC /></Wrap>
          </DCArtboard>
        </DCSection>

        <DCSection id="entry" title="Entrada" subtitle="La primera pantalla">
          <DCArtboard id="login" label="Login" width={410} height={864}>
            <Wrap><LoginC /></Wrap>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>

      <TweaksPanel>
        <TweakSection title="Marcador del contador">
          <TweakNumber label="Nosotros" value={t.counterScore1} min={0} max={t.counterMax} onChange={v => setTweak('counterScore1', v)} />
          <TweakNumber label="Ellos" value={t.counterScore2} min={0} max={t.counterMax} onChange={v => setTweak('counterScore2', v)} />
          <TweakSlider label="Se juega a" value={t.counterMax} min={20} max={50} step={10} onChange={v => setTweak('counterMax', v)} />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
